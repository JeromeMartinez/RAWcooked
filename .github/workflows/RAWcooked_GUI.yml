name: GUI

on: [push, pull_request]

jobs:

  Linux:
    strategy:
      matrix:
        include:
          # The oldest runners: the AppImage runs on the distributions with the same or a newer C library
          - { os: ubuntu-22.04, arch: x86_64, host: linux, qt: linux_gcc_64 }
          - { os: ubuntu-24.04-arm, arch: aarch64, host: linux_arm64, qt: linux_gcc_arm64 } # Tools of Qt for aarch64 need the C library of Ubuntu 24.04
      fail-fast: false
    runs-on: ${{ matrix.os }}
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1 # AppImage tools without FUSE
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: OS packets
        run: |
          # OpenGL for building with Qt, X libraries of the xcb plugin of Qt, X server for the check
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 xvfb
      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.*' # Same as for Windows
          host: ${{ matrix.host }}
          arch: ${{ matrix.qt }}
          cache: true
      - name: Compile
        run: |
          cd Project/Qt
          qmake rawcooked-gui.pro
          make -j$(nproc)
      - name: Package
        run: |
          cd Project/Qt
          # FFmpeg is not in the package: its libraries are loaded at run time from the system (ffmpeg-ma or FFmpeg packages of the distribution)
          for Tool in linuxdeploy/linuxdeploy/1-alpha-20251107-1/linuxdeploy linuxdeploy/linuxdeploy-plugin-qt/1-alpha-20250213-1/linuxdeploy-plugin-qt ; do
            curl -fsSL -o ${Tool##*/}-${{ matrix.arch }}.AppImage https://github.com/${Tool%/*/*}/releases/download/$(echo ${Tool} | cut -d/ -f3)/${Tool##*/}-${{ matrix.arch }}.AppImage
            chmod +x ${Tool##*/}-${{ matrix.arch }}.AppImage
          done
          # Icons of the theme at each size, named as in the desktop file
          Icons=$(for File in ../../Source/Resource/Image/hicolor/*/apps/rawcooked.* ; do printf -- '-i %s ' ${File} ; done)
          ./linuxdeploy-${{ matrix.arch }}.AppImage --appdir AppDir -e rawcooked-gui -d rawcooked-gui.desktop ${Icons} --plugin qt --output appimage
          Version=$(cat ../version.txt)
          mv RAWcooked-*${{ matrix.arch }}.AppImage RAWcooked_GUI_${Version}_Linux_${{ matrix.arch }}.AppImage
          echo "Version=${Version}" >> "${GITHUB_ENV}"
      - name: Check
        run: |
          cd Project/Qt
          # The user interface starts and stays open: still running when the time is over
          Result=0
          timeout 10 xvfb-run -a ./RAWcooked_GUI_${Version}_Linux_${{ matrix.arch }}.AppImage || Result=${?}
          test ${Result} -eq 124
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: RAWcooked_GUI_${{ env.Version }}_Linux_${{ matrix.arch }}
          path: Project/Qt/RAWcooked_GUI_${{ env.Version }}_Linux_${{ matrix.arch }}.AppImage
          if-no-files-found: error

  macOS:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.*' # Its macOS libraries are universal (x86_64 and arm64), the open source 6.8 LTS does not build with the current SDK
          cache: true
      - name: Compile
        run: |
          cd Project/Qt
          qmake rawcooked-gui.pro QMAKE_APPLE_DEVICE_ARCHS="x86_64 arm64"
          make -j$(sysctl -n hw.ncpu)
          lipo -archs RAWcooked.app/Contents/MacOS/RAWcooked
      - name: Package
        run: |
          cd Project/Qt
          macdeployqt RAWcooked.app
          # FFmpeg shared build in the ffmpeg directory next to the executable, as for the command line program
          curl -fsSL -o FFmpeg.zip https://mediaarea.net/download/binary/ffmpeg/9.0.1/FFmpeg_Bin_9.0.1_Mac_Shared_universal.zip
          7za x -y -oRAWcooked.app/Contents/MacOS/ffmpeg FFmpeg.zip > /dev/null
          rm FFmpeg.zip
          # The package has 3 copies of each library (libX.dylib, libX.N.dylib, libX.N.M.P.dylib), not links:
          # only libX.N.dylib, the name used by the programs, the other libraries and the user interface
          find RAWcooked.app/Contents/MacOS/ffmpeg/lib -name '*.dylib' ! -name 'lib*.[0-9]*.dylib' -delete
          find RAWcooked.app/Contents/MacOS/ffmpeg/lib -name 'lib*.[0-9]*.[0-9]*.dylib' -delete
          ls RAWcooked.app/Contents/MacOS/ffmpeg/lib
          # Libraries refer to each other with @executable_path/../lib, which is their directory for ffmpeg/bin/ffmpeg but not for the user interface:
          # @loader_path/../lib instead, same directory for both
          for Lib in RAWcooked.app/Contents/MacOS/ffmpeg/lib/*.dylib ; do
            for Dep in $(otool -L "${Lib}" | sed -n 's|^[[:space:]]*@executable_path/\.\./lib/\([^ ]*\) .*|\1|p' | sort -u) ; do
              install_name_tool -change "@executable_path/../lib/${Dep}" "@loader_path/../lib/${Dep}" "${Lib}"
            done
          done
          # Ad-hoc signature (no Developer ID on the CI), needed for running on Apple silicon after the changes
          codesign --force --deep --sign - RAWcooked.app
          codesign --verify --deep RAWcooked.app
          RAWcooked.app/Contents/MacOS/ffmpeg/bin/ffmpeg -hide_banner -version | sed -n 1p
      - name: Check
        run: |
          cd Project/Qt
          # The user interface starts and stays open, without display
          QT_QPA_PLATFORM=offscreen RAWcooked.app/Contents/MacOS/RAWcooked &
          Pid=${!}
          sleep 10
          kill -0 ${Pid}
          kill ${Pid}
      - name: Disk image
        run: |
          cd Project/Qt
          Version=$(cat ../version.txt)
          mkdir DiskImage
          cp -R RAWcooked.app DiskImage/
          cp ../../License.html DiskImage/
          ln -s /Applications DiskImage/Applications
          hdiutil create -volname RAWcooked -srcfolder DiskImage -fs HFS+ -format UDZO -ov RAWcooked_GUI_${Version}_Mac.dmg
          echo "Version=${Version}" >> "${GITHUB_ENV}"
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: RAWcooked_GUI_${{ env.Version }}_Mac
          path: Project/Qt/RAWcooked_GUI_${{ env.Version }}_Mac.dmg
          if-no-files-found: error

  Windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.*' # aqtinstall does not know the new layout of the Windows packages of 6.11 on the Qt server
          arch: win64_msvc2022_64
          cache: true
      - name: MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Compile
        shell: cmd # link of Git Bash would be found before the linker of MSVC
        run: |
          curl -fsSL -o jom.zip https://download.qt.io/official_releases/jom/jom.zip || exit /b 1
          7z x -y -ojom jom.zip > nul || exit /b 1
          cd Project\Qt || exit /b 1
          qmake rawcooked-gui.pro || exit /b 1
          ..\..\jom\jom.exe || exit /b 1
      - name: Package
        run: |
          cd Project/Qt/x64
          windeployqt --release --no-translations --no-compiler-runtime RAWcooked-GUI.exe
          # FFmpeg shared build in the ffmpeg directory next to the executables
          curl -fsSL -o FFmpeg.zip https://mediaarea.net/download/binary/ffmpeg/9.0.1/FFmpeg_Bin_9.0.1_Windows_Shared_x64.zip
          7z x -y -offmpeg FFmpeg.zip > /dev/null
          rm FFmpeg.zip
          # Runtime of MSVC next to the executables instead of its installer: nothing to install
          for Dir in . ffmpeg/bin ; do
            for File in msvcp140 msvcp140_1 msvcp140_2 vcruntime140 vcruntime140_1 ; do
              cp "$(cygpath -u "${VCToolsRedistDir}")"x64/Microsoft.VC*.CRT/${File}.dll ${Dir}/
            done
          done
      - name: Check
        run: |
          cd Project/Qt/x64
          # Only the system directories in PATH, everything else must be in the package
          export PATH=/c/Windows/System32:/c/Windows:/usr/bin
          ffmpeg/bin/ffmpeg -hide_banner -version | sed -n 1p
          # The user interface starts and stays open
          ./RAWcooked-GUI.exe &
          Pid=${!}
          sleep 10
          kill -0 ${Pid}
          kill ${Pid}
      - name: Archive
        run: |
          Version=$(tr -d '\r\n' < Project/version.txt)
          cd Project/Qt/x64
          7z a -tzip ../RAWcooked_GUI_${Version}_Windows_x64.zip . > /dev/null
          echo "Version=${Version}" >> "${GITHUB_ENV}"
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: RAWcooked_GUI_${{ env.Version }}_Windows_x64
          path: Project/Qt/RAWcooked_GUI_${{ env.Version }}_Windows_x64.zip
          if-no-files-found: error
      - name: Installer
        run: |
          MakeNsis="/c/Program Files (x86)/NSIS/makensis.exe"
          [ -x "${MakeNsis}" ] || choco install nsis -y --no-progress > /dev/null
          "${MakeNsis}" -V2 -WX -DPRODUCT_VERSION=${Version} Source/Install/RAWcooked_GUI_Windows_x64.nsi
          # Silent install in another directory, then the installed programs, then silent uninstall (waiting for its end): only the uninstaller is left
          export MSYS_NO_PATHCONV=1
          Release/RAWcooked_GUI_${Version}_Windows_x64.exe /S '/D=C:\RAWcooked_Test'
          /c/RAWcooked_Test/ffmpeg/bin/ffmpeg.exe -hide_banner -version | sed -n 1p
          /c/RAWcooked_Test/RAWcooked-GUI.exe &
          Pid=${!}
          sleep 10
          kill -0 ${Pid}
          kill ${Pid}
          sleep 2
          /c/RAWcooked_Test/uninst.exe /S '_?=C:\RAWcooked_Test'
          Left=$(ls -A /c/RAWcooked_Test)
          echo "Left after uninstall: ${Left}"
          test "${Left}" == "uninst.exe"
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: RAWcooked_GUI_${{ env.Version }}_Windows_x64_Installer
          path: Release/RAWcooked_GUI_${{ env.Version }}_Windows_x64.exe
          if-no-files-found: error
