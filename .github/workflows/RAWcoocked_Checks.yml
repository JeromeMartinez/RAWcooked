name: Checks

on: [push, pull_request]

jobs:

  # TEMP: Vulkan on the GPU of the macOS runners (virtual machines), with MoltenVK and KosmicKrisp (macOS 26, Metal 4)
  macOS_GPU:
    strategy:
      matrix:
        os: [macos-15, macos-26]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: OS packets
        run: |
          # Warnings of Homebrew about formulae of the runner image (migrations, cleanup) in the log but not as annotations
          StopToken=$(uuidgen)
          echo "::stop-commands::${StopToken}"
          brew update
          brew install coreutils automake mesa molten-vk vulkan-loader vulkan-tools
          echo "::${StopToken}::"
      - name: FFmpeg
        run: |
          cd Project/GNU/CLI
          # Latest snapshot and 9.0.1 (the latest snapshot crashes in the ffv1_vulkan encoder with llvmpipe on CPUs without AVX-512, maybe also on a GPU)
          curl -fsSL -o FFmpeg_latest.zip https://mediaarea.net/download/snapshots/binary/ffmpeg/latest/FFmpeg_Bin_Latest_Mac_Static_universal.zip
          curl -fsSL -o FFmpeg_9.0.1.zip https://mediaarea.net/download/binary/ffmpeg/9.0.1/FFmpeg_Bin_9.0.1_Mac_Static_universal.zip
          for Build in latest 9.0.1 ; do
            7za e -y -oFFmpeg_${Build} FFmpeg_${Build}.zip bin/ffmpeg > /dev/null
            mv FFmpeg_${Build}/ffmpeg ffmpeg-${Build}
            rm -r FFmpeg_${Build} FFmpeg_${Build}.zip
            ./ffmpeg-${Build} -hide_banner -version | sed -n 1p
          done
      - name: Configure
        run: |
          cd Project/GNU/CLI
          sh autogen.sh
          ./configure
      - name: Compile
        run: |
          cd Project/GNU/CLI
          make
      - name: Check files
        run: |
          cd Project/GNU/CLI
          make clone_testing_files
      - name: GPU
        run: |
          sw_vers
          sysctl -n machdep.cpu.brand_string
          system_profiler SPDisplaysDataType
          echo "Vulkan drivers (ICD) installed:"
          find -L "$(brew --prefix)/etc/vulkan" "$(brew --prefix)/share/vulkan" -name '*.json' 2>/dev/null || true
      - name: Experiments
        run: |
          cd Project/GNU/CLI
          Summary=
          for Driver in MoltenVK KosmicKrisp lavapipe ; do
            case ${Driver} in
              MoltenVK) Json=$(find -L "$(brew --prefix)/etc/vulkan" "$(brew --prefix)/share/vulkan" "$(brew --prefix molten-vk)" -name 'MoltenVK_icd.json' -print -quit 2>/dev/null || true) ;;
              KosmicKrisp) Json=$(find -L "$(brew --prefix mesa)/share/vulkan/icd.d" -name 'kosmickrisp*.json' -print -quit 2>/dev/null || true) ;;
              lavapipe) Json=$(find -L "$(brew --prefix mesa)/share/vulkan/icd.d" -name 'lvp_icd*.json' -print -quit 2>/dev/null || true) ;;
            esac
            if [ -z "${Json}" ] ; then
              Summary="${Summary}${Driver}: driver not found"$'\n'
              continue
            fi
            export VK_DRIVER_FILES="${Json}"
            echo "::group::${Driver}: vulkaninfo (${Json})"
            vulkaninfo --summary 2>&1 || true
            # Some features used by FFmpeg Vulkan (FFV1)
            vulkaninfo 2>/dev/null | grep -E '^\s*(shaderInt64|shaderInt16|shaderInt8|storageBuffer8BitAccess|storageBuffer16BitAccess|bufferDeviceAddress|timelineSemaphore|synchronization2|descriptorBuffer|hostQueryReset|subgroupSize|maxSubgroupSize|maxComputeSharedMemorySize|maxComputeWorkGroupInvocations|maxStorageBufferRange)\s*=' | tr -s ' \t' ' ' | sort -u || true
            echo "::endgroup::"
            if [ "${Driver}" == "lavapipe" ] ; then
              continue # Tested by the main macOS job (FFmpeg 9.0.1), shown here for comparison only
            fi
            for Build in latest 9.0.1 ; do
              cp ffmpeg-${Build} ffmpeg
              echo "::group::${Driver}, FFmpeg ${Build}: test/vulkan.sh"
              ./ffmpeg -hide_banner -v verbose -init_hw_device vulkan=vk:0 -f lavfi -i nullsrc=s=64x64 -frames:v 1 -f null - 2>&1 | grep -i -E 'vulkan|device|gpu|error|fail|unsupported|not supported' | head -n 30 || true
              Result=0
              SECONDS=0
              gtimeout -k 10 1500 bash test/vulkan.sh > vulkan.log 2>&1 9>&1 || Result=${?}
              cat vulkan.log
              echo "::endgroup::"
              Oks=$(grep -c '^OK:' vulkan.log || true)
              Noks=$(grep -c '^NOK:' vulkan.log || true)
              Summary="${Summary}${Driver}, FFmpeg ${Build}: exit code ${Result} (124 = timeout), ${SECONDS} s, ${Oks} OK, ${Noks} NOK"$'\n'
              if [ "${Noks}" != "0" ] ; then
                Summary="${Summary}$(grep -m 3 '^NOK:' vulkan.log | cut -c 1-400)"$'\n' # First issues
              fi
            done
          done
          unset VK_DRIVER_FILES
          echo "Summary:"
          echo -n "${Summary}"
